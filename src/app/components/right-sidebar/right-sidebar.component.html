<nav class="slim-sidebar right-sidebar" [class.light-mode]="isLightMode()">
  <!-- Toggle Collapse Button (Ganz oben) -->
  <button 
    mat-mini-fab 
    color="primary" 
    type="button"
    class="toggle-btn" 
    (click)="onToggle($event)"
  >
    <mat-icon>{{ isCollapsed() ? 'chevron_left' : 'chevron_right' }}</mat-icon>
  </button>

  <mat-divider class="divider"></mat-divider>

  <!-- Navigation Icons VERTIKAL untereinander -->
  <div class="nav-section">
    @for (item of navItems; track item.id) {
      <button 
        mat-icon-button 
        type="button"
        class="nav-item" 
        [class.active]="activeTab() === item.id && !isCollapsed()"
        [matTooltip]="item.label"
        (click)="selectTab(item.id, $event)"
      >
        <mat-icon>{{ item.icon }}</mat-icon>
      </button>
    }
  </div>
</nav>
